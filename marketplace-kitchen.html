<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace &amp; Kitchen — Under Construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FDF6EC;
    --charcoal: #1A1A1A;
    --green: #8DC63F;
    --forest: #2A6040;
    --orange: #E85A1C;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    color: var(--charcoal);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow-x: hidden;
  }
  /* Subtle grain texture, same as the main site */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }
  .wrap { padding: 4rem 1.5rem; max-width: 640px; }
  .art {
    width: 176px; height: 176px;
    margin: 0 auto 2.5rem;
    border-radius: 50%;
    border: 2px solid var(--forest);
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 20px 40px -20px rgba(42, 96, 64, 0.35);
    animation: pop 0.8s ease-out both;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 0.5rem;
    border: 2px solid var(--forest);
    color: var(--forest);
    border-radius: 999px;
    padding: 0.5rem 1.25rem;
    font-size: 0.75rem; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    margin-bottom: 2rem;
    animation: rise 0.6s ease-out 0.2s both;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 8vw, 4.8rem);
    line-height: 0.95;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
    animation: rise 0.8s ease-out 0.3s both;
  }
  h1 .accent { color: var(--orange); font-style: italic; font-weight: 400; }
  .tagline {
    font-size: 0.85rem; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(26, 26, 26, 0.55);
    margin-bottom: 2rem;
    animation: rise 0.8s ease-out 0.4s both;
  }
  p.desc {
    font-size: 1.15rem; font-weight: 300;
    line-height: 1.7;
    color: rgba(26, 26, 26, 0.7);
    margin-bottom: 3rem;
    animation: rise 0.8s ease-out 0.5s both;
  }
  .home {
    display: inline-block;
    background: var(--orange);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.1em; text-transform: uppercase;
    padding: 1.15rem 2.5rem;
    border-radius: 0.75rem;
    box-shadow: 0 0 40px -10px rgba(232, 90, 28, 0.5);
    transition: box-shadow 0.3s ease;
    animation: rise 0.8s ease-out 0.6s both;
  }
  .home:hover { box-shadow: 0 0 60px -10px rgba(232, 90, 28, 0.7); }
  @keyframes rise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
  .corner-logo {
    position: absolute;
    top: 1.25rem; left: 1.25rem;
    width: 72px; height: auto;
    object-fit: contain;
    animation: pop 0.8s ease-out both;
    z-index: 10;
  }
  @media (min-width: 768px) { .corner-logo { width: 96px; } }
</style>
</head>
<body>
  <img src="kitchen-marketplace-logo.png" alt="Kitchen &amp; Marketplace logo" class="corner-logo">
  <main class="wrap">
    <div class="art">
      <svg width="110" height="110" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M8 20c0-8 7.2-13 16-13s16 5 16 13v1H8v-1Z" fill="#E8A33D" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M17 13.5h.01M24 11.5h.01M31 13.5h.01" stroke="#FDF6EC" stroke-width="3" stroke-linecap="round"/>
        <path d="M8 24c2.6 2.4 5.4 2.4 8 0s5.4-2.4 8 0 5.4 2.4 8 0 5.4-2.4 8 0" stroke="#8DC63F" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <path d="M10 28h28l-4 4H14l-4-4Z" fill="#F5C542" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/>
        <rect x="10" y="31" width="28" height="5" rx="2.5" fill="#6B3E26" stroke="#1A1A1A" stroke-width="2"/>
        <path d="M9 38h30v1a4 4 0 0 1-4 4H13a4 4 0 0 1-4-4v-1Z" fill="#E8A33D" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="badge">&#9881; Under construction</div>
    <h1>Marketplace <span class="accent">&amp; Kitchen</span></h1>
    <div class="tagline">Make, Bake &amp; Sell</div>
    <p class="desc">The community kitchen is being set up. Soon you will be able to make, bake, and sell your homemade goods right here.</p>
    <a class="home" href="https://livingfoodspk.com">Back to Living Foods</a>
  </main>
</body>
</html>
